name: Build and deploy MERN images to Render

on:
  push:
    branches: [main]
    paths:
      - 'mern-demo/server/**'
      - 'mern-demo/client/**'
      - '.github/workflows/render-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./mern-demo/server
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:render-2.0
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:latest

      - uses: docker/build-push-action@v6
        with:
          context: ./mern-demo/client
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:render-2.0
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:latest

      - name: Trigger Render deploy hooks
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
          FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -euo pipefail
          for hook in "$BACKEND_HOOK" "$FRONTEND_HOOK"; do
            if [[ -n "$hook" ]]; then
              curl --fail --silent --show-error --request POST "$hook"
            fi
          done
