services:
  backend:
    image: admin2906/mern-backend:aws-2.0
    build: ./server
    container_name: mern-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"

  frontend:
    image: admin2906/mern-frontend:aws-5.0
    build: ./client
    container_name: mern-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:5000
      PORT: 4173
    ports:
      - "127.0.0.1:4174:4173"
    depends_on:
      - backend
